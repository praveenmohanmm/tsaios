name: iOS Build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build iOS (Swift/Xcode)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # ── Simulator build (always runs, confirms the code compiles) ──────────
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project tsaios.xcodeproj \
            -scheme tsaios \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── Signed IPA (only on v* tags, requires secrets) ────────────────────
      - name: Install Apple Distribution Certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIST_CERTIFICATE_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          DIST_CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$DIST_CERTIFICATE_P12" | base64 --decode -o $RUNNER_TEMP/distribution.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/distribution.p12 \
            -P "$DIST_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "=== Installed certificates ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i $PP_PATH | plutil -extract Name raw -)
          APP_ID=$(security cms -D -i $PP_PATH | plutil -extract Entitlements.application-identifier raw -)
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "=== Installed provisioning profile ==="
          echo "  UUID : $UUID"
          echo "  Name : $PROFILE_NAME"
          echo "  AppID: $APP_ID"

      - name: Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          xcodebuild archive \
            -project tsaios.xcodeproj \
            -scheme tsaios \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/tsaios.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"
          echo "=== Archive contents ==="
          ls -la $RUNNER_TEMP/tsaios.xcarchive/Products/Applications/ 2>/dev/null || echo "No Applications in archive"

      - name: Export IPA
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -o pipefail
          echo "=== ExportOptions.plist ==="
          cat ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/tsaios.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa \
            -verbose 2>&1 | tee $RUNNER_TEMP/export.log
          echo "=== Export directory contents ==="
          ls -la $RUNNER_TEMP/ipa/

      - name: Upload IPA as artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tsaios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn

      - name: Create GitHub Release with IPA
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa file found. Export log:"
            cat $RUNNER_TEMP/export.log || true
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          gh release create ${{ github.ref_name }} \
            "$IPA_PATH" \
            --title "Traffic Signal Alert ${{ github.ref_name }}" \
            --generate-notes \
            --repo ${{ github.repository }}
