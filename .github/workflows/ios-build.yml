name: iOS Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build iOS (Swift/Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project tsaios.xcodeproj \
            -scheme tsaios \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
