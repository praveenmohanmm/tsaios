name: iOS Build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build iOS (Swift/Xcode)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # ── Simulator build (always runs, confirms the code compiles) ──────────
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project tsaios.xcodeproj \
            -scheme tsaios \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── Signed IPA (only on v* tags, requires secrets) ────────────────────
      - name: Install Apple Development Certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIST_CERTIFICATE_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          DIST_CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$DIST_CERTIFICATE_P12" | base64 --decode -o $RUNNER_TEMP/distribution.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/distribution.p12 \
            -P "$DIST_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "=== Installed certificates ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install iOS Provisioning Profile
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i $PP_PATH | plutil -extract Name raw -)
          APP_ID=$(security cms -D -i $PP_PATH | plutil -extract Entitlements.application-identifier raw -)
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "=== Installed iOS provisioning profile ==="
          echo "  UUID : $UUID"
          echo "  Name : $PROFILE_NAME"
          echo "  AppID: $APP_ID"

      # Optional: install Watch provisioning profile when secret is provided.
      # Set WATCH_PROVISIONING_PROFILE (base64 .mobileprovision) and
      # WATCH_PROVISIONING_PROFILE_NAME in repo secrets to enable Watch signing.
      - name: Install Watch Provisioning Profile
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WATCH_PROVISIONING_PROFILE: ${{ secrets.WATCH_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$WATCH_PROVISIONING_PROFILE" ]; then
            echo "WATCH_PROVISIONING_PROFILE secret not set — skipping Watch profile install"
            exit 0
          fi
          WPP_PATH=$RUNNER_TEMP/watch_profile.mobileprovision
          echo -n "$WATCH_PROVISIONING_PROFILE" | base64 --decode -o $WPP_PATH
          UUID=$(security cms -D -i $WPP_PATH | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i $WPP_PATH | plutil -extract Name raw -)
          cp $WPP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "=== Installed Watch provisioning profile ==="
          echo "  UUID : $UUID"
          echo "  Name : $PROFILE_NAME"

      - name: Archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WATCH_PP_NAME: ${{ secrets.WATCH_PROVISIONING_PROFILE_NAME }}
          IOS_PP_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          # xcodebuild command-line args do NOT support [sdk=...] conditionals —
          # those only work in xcconfig files. Write a temporary xcconfig so we
          # can set per-SDK signing settings without command-line interference.
          XCCONFIG=$RUNNER_TEMP/signing.xcconfig

          if [ -n "$WATCH_PP_NAME" ]; then
            echo "Watch signing: MANUAL with profile '$WATCH_PP_NAME'"
            {
              echo "CODE_SIGN_STYLE = Manual"
              echo "CODE_SIGN_IDENTITY = Apple Development"
              echo "PROVISIONING_PROFILE_SPECIFIER = $IOS_PP_NAME"
              echo "CODE_SIGN_STYLE[sdk=watchos*] = Manual"
              echo "CODE_SIGN_IDENTITY[sdk=watchos*] = Apple Development"
              echo "PROVISIONING_PROFILE_SPECIFIER[sdk=watchos*] = $WATCH_PP_NAME"
            } > "$XCCONFIG"
          else
            echo "Watch signing: DISABLED (WATCH_PROVISIONING_PROFILE_NAME not set)"
            {
              echo "CODE_SIGN_STYLE = Manual"
              echo "CODE_SIGN_IDENTITY = Apple Development"
              echo "PROVISIONING_PROFILE_SPECIFIER = $IOS_PP_NAME"
              echo "CODE_SIGNING_REQUIRED[sdk=watchos*] = NO"
              echo "CODE_SIGN_IDENTITY[sdk=watchos*] ="
            } > "$XCCONFIG"
          fi

          echo "=== signing.xcconfig ==="
          cat "$XCCONFIG"

          xcodebuild archive \
            -project tsaios.xcodeproj \
            -scheme tsaios \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/tsaios.xcarchive \
            -xcconfig "$XCCONFIG" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          echo "=== Archive contents ==="
          ls -la $RUNNER_TEMP/tsaios.xcarchive/Products/Applications/ 2>/dev/null || echo "No Applications in archive"

      - name: Export IPA
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WATCH_PP_NAME: ${{ secrets.WATCH_PROVISIONING_PROFILE_NAME }}
        run: |
          set -o pipefail
          # When no Watch profile is available, skip embedding the Watch app
          # so the export succeeds without a Watch signing identity.
          EXPORT_PLIST=$RUNNER_TEMP/ExportOptions.plist
          cp ExportOptions.plist $EXPORT_PLIST
          if [ -z "$WATCH_PP_NAME" ]; then
            echo "No Watch profile — adding skipWatchApp=true to ExportOptions"
            /usr/libexec/PlistBuddy -c "Add :skipWatchApp bool true" $EXPORT_PLIST
          else
            echo "Watch profile found — adding to ExportOptions provisioning profiles"
            /usr/libexec/PlistBuddy \
              -c "Add :provisioningProfiles:com.poodlesoft.tsaios.watchkitapp string $WATCH_PP_NAME" \
              $EXPORT_PLIST
          fi
          echo "=== ExportOptions.plist ==="
          cat $EXPORT_PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/tsaios.xcarchive \
            -exportOptionsPlist $EXPORT_PLIST \
            -exportPath $RUNNER_TEMP/ipa \
            -verbose 2>&1 | tee $RUNNER_TEMP/export.log
          echo "=== Export directory contents ==="
          ls -la $RUNNER_TEMP/ipa/

      - name: Generate OTA manifest and install page
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/${TAG}/tsaios.ipa"
          MANIFEST_URL="https://github.com/${REPO}/releases/download/${TAG}/manifest.plist"

          # Generate manifest.plist
          cat > $RUNNER_TEMP/ipa/manifest.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${IPA_URL}</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.poodlesoft.tsaios</string>
                          <key>bundle-version</key>
                          <string>${TAG}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>Alert ME</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # Generate install.html — open this in Safari on iPhone to install
          INSTALL_URL="itms-services://?action=download-manifest&url=${MANIFEST_URL}"
          cat > $RUNNER_TEMP/ipa/install.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Install Alert ME</title>
            <style>
              body { font-family: -apple-system, sans-serif; text-align: center;
                     padding: 60px 20px; background: #f2f2f7; }
              h1 { font-size: 24px; color: #1c1c1e; }
              p  { color: #6c6c70; margin: 10px 0 30px; }
              a  { display: inline-block; background: #007aff; color: white;
                   padding: 16px 40px; border-radius: 12px; text-decoration: none;
                   font-size: 18px; font-weight: 600; }
            </style>
          </head>
          <body>
            <h1>🚦 Alert ME</h1>
            <p>Version ${TAG} &mdash; Open this page in Safari on your iPhone</p>
            <a href="${INSTALL_URL}">Install on iPhone</a>
          </body>
          </html>
          EOF

          echo "Generated manifest.plist and install.html"
          echo "Install URL: ${INSTALL_URL}"

      - name: Create GitHub Release with IPA + OTA files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa file found. Export log:"
            cat $RUNNER_TEMP/export.log || true
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          gh release create ${{ github.ref_name }} \
            "$IPA_PATH" \
            "$RUNNER_TEMP/ipa/manifest.plist" \
            "$RUNNER_TEMP/ipa/install.html" \
            --title "Alert ME ${{ github.ref_name }}" \
            --notes "## Install on iPhone

          ### Method 1 — Tap to install (Safari on iPhone)
          1. Open this page on your iPhone in **Safari**
          2. Tap **install.html** asset below to download it
          3. Tap the **Install on iPhone** button
          4. Go to Settings → General → VPN & Device Management → Trust

          ### Method 2 — Sideloadly (Windows/Mac)
          1. Download \`tsaios.ipa\` below
          2. Open [Sideloadly](https://sideloadly.io), connect iPhone, drag IPA in

          ### Apple Watch
          The Watch companion app (\`Alert ME\` on watchOS) is embedded in the IPA when
          \`WATCH_PROVISIONING_PROFILE_NAME\` secret is set. Install the iPhone app first —
          the Watch app installs automatically alongside it." \
            --repo ${{ github.repository }}
